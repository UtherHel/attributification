# dev/mt.py settings of Attributification (see dev/README.md)

# The everyday set: the active version on both of its loaders, the oldest (Forge) and the newest targets.
# `python dev/mt.py smoke "*"` runs every target.
default_targets = ["1.21.1-fabric", "1.21.1-neoforge", "1.20.1-forge", "26.3-fabric"]

# known-harmless log lines (regexes)
log_noise = []

# Found by the self-test, not fixed yet (a failure here prints "known issue" instead of failing the run): mappings
# from a server datapack never reach the client (there is no sync packet), so the client computes the vanilla value for
# a mapped attribute: client-side movement, tooltips and the attribute screen disagree with the server
known_failures = ["client/client_has_server_mappings", "client/client_luck_matches_server"]

# runtime mods besides the mod jar (published production jars): the mandatory dependencies of fabric.mod.json
[runtime]
fabric = ["maven:net.fabricmc.fabric-api:fabric-api:${deps.fabric_api}"]

# The scenes' mappings, as a world datapack. Every attribute is listed under its old ("generic.") and new id: a
# mapping uses the first id that exists, so one file serves 1.20.1 - 26.x. pack.mcmeta: pack_format for the versions
# that read it, supported_formats / min_format / max_format for the ones that check a range.
[files_server."*"]
"world/datapacks/modtest/pack.mcmeta" = '''
{"pack": {"description": "modtest", "pack_format": ${mod.pack_format:-94}, "supported_formats": [0, 999], "min_format": 0, "max_format": 999}}
'''
"world/datapacks/modtest/data/modtest/attributification/mappings/selftest.json" = '''
{
  "mappings": [
