modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
logoFile = "assets/${id}/icon.png"
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "UtherHel"
description = '''
Unifies similar attributes from different mods with configurable conversion coefficients to prevent duplication and improve compatibility.
'''

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${loader}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
