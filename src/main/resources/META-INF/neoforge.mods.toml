modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
logoFile = "assets/${id}/icon.png"
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "UtherHel"
description = '''
Unifies similar attributes from different mods with configurable conversion coefficients to prevent duplication and improve compatibility.
'''

[[mixins]]
config = "attributification.mixins.json"

[[mixins]]
config = "attributification.neoforge.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
