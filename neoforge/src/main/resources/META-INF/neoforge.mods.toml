modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
logoFile = "assets/attributification/icon.png"
modId = "attributification"
version = "${version}"
displayName = "Attributification"
authors = "UtherHel"
description = '''
Unifies similar attributes from different mods with configurable conversion coefficients to prevent duplication and improve compatibility.
'''

[[mixins]]
config = "attributification.mixins.json"

[[dependencies.attributification]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.attributification]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.attributification]]
modId = "architectury"
type = "required"
versionRange = "[13.0.6,)"
ordering = "AFTER"
side = "BOTH"
