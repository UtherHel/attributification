mod.mc_releases = ["26.3"]

[fabric."26.3"]
mod.mc_compat = "26.3"
mod.loader_compat = ">=0.17"
deps.fabric_api = "0.166.2+26.3"

[neoforge."26.3"]
mod.mc_compat = "[26.3]"
mod.loader_compat = "[26.3,)"
deps.neo_loader = "26.3.0.115"

